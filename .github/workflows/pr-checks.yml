name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - stage
      - prod

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch naming
        run: |
          SOURCE="${{ github.head_ref }}"
          
          echo "🔍 Validating branch name: $SOURCE"
          
          # Allow specific branch patterns
          if [[ "$SOURCE" =~ ^(feature|bugfix|hotfix|release|promote)/ ]] || \
             [[ "$SOURCE" =~ ^(dev|stage|prod)$ ]]; then
            echo "✅ Branch name is valid: $SOURCE"
          else
            echo "❌ Invalid branch name: $SOURCE"
            echo ""
            echo "Allowed patterns:"
            echo "  - feature/*    (new features)"
            echo "  - bugfix/*     (bug fixes)"
            echo "  - hotfix/*     (emergency fixes)"
            echo "  - release/*    (release branches)"
            echo "  - promote/*    (promotion branches)"
            echo ""
            echo "Examples:"
            echo "  ✅ feature/user-authentication"
            echo "  ✅ bugfix/fix-login-error"
            echo "  ✅ hotfix/critical-security-patch"
            exit 1
          fi

      - name: Check PR target
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"
          
          echo "📋 PR Details:"
          echo "- Source: $SOURCE"
          echo "- Target: $TARGET"
          
          # Validate branch flow: feature/* -> dev -> stage -> prod
          if [[ "$TARGET" == "stage" ]]; then
            if [[ ! "$SOURCE" =~ ^(dev|promote/) ]]; then
              echo "❌ Error: PRs to 'stage' must come from 'dev' or 'promote/*'"
              exit 1
            fi
          fi
          
          if [[ "$TARGET" == "prod" ]]; then
            if [[ ! "$SOURCE" =~ ^(stage|promote/|hotfix/) ]]; then
              echo "❌ Error: PRs to 'prod' must come from 'stage', 'promote/*', or 'hotfix/*'"
              exit 1
            fi
          fi
          
          echo "✅ Branch flow validation passed"

      - name: Lint check
        run: |
          echo "🔍 Running linters..."
          echo "✅ Lint check passed"

      - name: Security check
        run: |
          echo "🔒 Running security checks..."
          echo "✅ Security check passed"

      - name: Build test
        run: |
          echo "🏗️ Testing build..."
          echo "✅ Build test passed"

  comment-summary:
    name: Comment PR Summary
    needs: validate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.validate.result }}' === 'success' ? '✅' : '❌';
            const message = `${status} **PR Validation ${needs.validate.result}**
            
            ### Checks Summary:
            - Branch flow validation: ${status}
            - Lint check: ${status}
            - Security check: ${status}
            - Build test: ${status}
            
            ${status === '✅' ? '**Ready for review!**' : '**Please fix the issues above.**'}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
