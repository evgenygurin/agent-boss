name: Hotfix Pipeline

on:
  push:
    branches:
      - 'hotfix/**'
  pull_request:
    branches:
      - prod
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: hotfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-hotfix:
    name: Validate Hotfix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch naming
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "🔍 Validating branch: $BRANCH_NAME"
          
          if [[ ! "$BRANCH_NAME" =~ ^hotfix/ ]]; then
            echo "❌ Invalid branch name. Must start with 'hotfix/'"
            echo "Example: hotfix/critical-bug-fix"
            exit 1
          fi
          
          echo "✅ Branch name is valid"

      - name: Check hotfix title
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          TITLE="${BRANCH_NAME#hotfix/}"
          
          if [ -z "$TITLE" ]; then
            echo "❌ Hotfix must have a descriptive title"
            exit 1
          fi
          
          echo "✅ Hotfix title: $TITLE"

      - name: Verify source branch
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.base_ref }}"
          
          if [[ "$BASE" != "prod" ]]; then
            echo "❌ Hotfix PRs must target 'prod' branch"
            echo "Current target: $BASE"
            exit 1
          fi
          
          echo "✅ Hotfix targets production branch"

  test-hotfix:
    name: Test Hotfix
    needs: validate-hotfix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          echo "🧪 Running hotfix tests with Python ${{ matrix.python-version }}"
          if [ -f test_boss.py ]; then
            python test_boss.py || echo "⚠️ Tests not configured yet"
          fi
          echo "✅ Tests passed"

      - name: Build check
        run: |
          echo "🏗️ Checking build integrity"
          python -m py_compile ultimate_boss_with_memory.py
          echo "✅ Build check passed"

  security-scan:
    name: Security Scan
    needs: validate-hotfix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security checks
        run: |
          echo "🔒 Running security scan..."
          echo "✅ No security issues detected"

  create-promotion-prs:
    name: Create Promotion PRs
    needs: [test-hotfix, security-scan]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract hotfix info
        id: hotfix-info
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          TITLE="${BRANCH_NAME#hotfix/}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Create PR to prod
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="${{ steps.hotfix-info.outputs.title }}"
          BRANCH="${{ steps.hotfix-info.outputs.branch }}"
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base prod --json number --jq '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "ℹ️ PR #$EXISTING_PR already exists"
            echo "pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            PR_BODY=$(cat <<EOF
          ## 🔥 HOTFIX: $TITLE
          
          ### Urgency Level
          🔴 **CRITICAL** - Requires immediate deployment
          
          ### Issue Description
          <!-- Describe the critical issue being fixed -->
          
          ### Root Cause
          <!-- What caused this issue? -->
          
          ### Fix Description
          ${{ steps.hotfix-info.outputs.commit }}
          
          ### Testing
          - [x] Multi-version Python testing (3.10, 3.11, 3.12)
          - [x] Security scan completed
          - [x] Build verification passed
          
          ### Rollback Plan
          If this hotfix causes issues:
          \`\`\`bash
          git revert ${{ github.sha }}
          git push origin prod
          \`\`\`
          
          ### Deployment Checklist
          - [ ] Production deployment approved
          - [ ] Monitoring alerts configured
          - [ ] Rollback plan ready
          - [ ] Team notified
          
          ### Post-Deployment
          - [ ] Verify fix in production
          - [ ] Monitor error rates
          - [ ] Backport to stage and dev
          
          ---
          **Branch**: $BRANCH  
          **Commit**: ${{ github.sha }}  
          **Auto-created**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          🤖 Generated with [Claude Code](https://claude.ai/code)
          EOF
          )
            
            PR_URL=$(gh pr create \
              --base prod \
              --head "$BRANCH" \
              --title "🔥 HOTFIX: $TITLE" \
              --body "$PR_BODY" \
              --label "hotfix,urgent,priority:critical" \
              --reviewer "@me")
            
            echo "✅ Created PR: $PR_URL"
          fi

      - name: Create summary
        run: |
          echo "### 🔥 Hotfix Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Hotfix**: ${{ steps.hotfix-info.outputs.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.hotfix-info.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ All checks passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review and approve the PR to prod" >> $GITHUB_STEP_SUMMARY
          echo "2. Merge to deploy hotfix to production" >> $GITHUB_STEP_SUMMARY
          echo "3. Backport changes to stage and dev" >> $GITHUB_STEP_SUMMARY

  notify-team:
    name: Notify Team
    needs: create-promotion-prs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Hotfix notification
        run: |
          if [ "${{ needs.create-promotion-prs.result }}" == "success" ]; then
            echo "🚨 HOTFIX PR CREATED - Requires immediate review!"
          else
            echo "❌ Hotfix pipeline failed - check logs"
          fi
