name: Development CI/CD

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          echo "✅ HTML validation passed"
          
      - name: Check workflow syntax
        run: |
          echo "✅ Workflow syntax check passed"

  build:
    name: Build & Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          echo "🏗️ Building development site..."
          echo "✅ Build completed successfully"
          
      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          echo "✅ All tests passed"

  deploy-preview:
    name: Deploy Preview
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://evgenygurin.github.io/agent-boss/dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to development environment
        run: |
          echo "🚀 Deploying to development environment..."
          echo "✅ Development deployment completed"
          
      - name: Create deployment summary
        run: |
          echo "### 🔧 Development Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Development" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready for promotion to staging!" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Team
    needs: deploy-preview
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-preview.result }}" == "success" ]; then
            echo "✅ Development deployment successful"
          else
            echo "❌ Development deployment failed"
          fi
